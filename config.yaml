# All tunable values. Secrets live in .env (see .env.example), never here.
# Every key is required: the bot validates this file at startup and refuses
# to run if anything is missing, misspelled or out of range.

mode: paper                    # paper | demo | live  (live also needs CONFIRM_LIVE_TRADING=yes)

discovery:
  scan_interval_sec: 5
  new_market_window_min: 10
  watch_duration_min: 60
  # Matched against the SERIES category (markets carry none; the event-level
  # field is deprecated). Kalshi's name for weather is "Climate and Weather"
  # -- see docs/API_NOTES.md section 9.
  include_categories: ["Climate and Weather"]
  exclude_series: []
  # Fallback REST sweep of the included series, in case lifecycle messages are
  # missed (downtime, a sequence gap). The lifecycle channel is primary.
  sweep_interval_min: 30
  sweep_lookback_hours: 24

fair_value:
  min_confidence: 0.6
  min_history: 20
  models: [sibling, historical]
  agree_within_cents: 5        # models this close are averaged (confidence-weighted)
  sibling:
    # Confidence = exp(-u / scale) x liquidity, u = combined price uncertainty
    # of the siblings in cents. At 15, siblings +/-5.6c (5c spreads x 5) give
    # 0.69; +/-1.1c (1c spreads) give 0.93. A starting point; Phase 5
    # calibration should set it.
    uncertainty_scale_cents: 15
    liquidity_ref_contracts: 50  # sibling depth that counts as fully liquid
  historical:
    # Capped below min_confidence: bucket base rates know nothing about the
    # day's forecast, which the live price does, so this model may
    # corroborate but must not trigger a trade alone until calibration
    # justifies more (docs/PLAN.md decision D).
    max_confidence: 0.5
    seasonal_window_days: 45   # prefer settled events within +/- this day-of-year

strategy:
  entry_threshold_cents: 20
  min_depth_contracts: 50
  take_profit_gap_cents: 5
  stop_loss_cents: 15
  max_hold_hours: 48
  pre_close_exit_min: 30
  hold_to_settlement: false
  order_timeout_sec: 30
  max_exit_slippage_cents: 5

risk:
  max_dollars_per_trade: 25
  max_total_exposure_dollars: 200
  max_positions_per_event: 1
  max_open_positions: 10
  daily_loss_limit_dollars: 50

recording:
  # Order book snapshots for watched markets: on change, at most once per
  # min_interval; and at least once per heartbeat even if nothing changed.
  snapshot_min_interval_sec: 2
  snapshot_heartbeat_sec: 30
  depth_levels: 10             # levels kept per side in each snapshot
  status_refresh_min: 30       # REST check of results for recorded markets

alerts:
  channel: none                # telegram | discord | email | none

storage:
  database_url: sqlite:///data/kalshi_bot.sqlite
